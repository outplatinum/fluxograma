    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f3460 0%, #16213e 50%, #1a5f7a 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 2000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 30px 20px;
            background: rgba(0, 200, 83, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(0, 200, 83, 0.3);
        }

        header h1 {
            font-size: 2.8em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            font-weight: 700;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1.2em;
            opacity: 0.95;
            font-weight: 300;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 25px;
            margin-bottom: 20px;
        }

        .flowchart-container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: auto;
            grid-column: 1;
            max-height: 1100px;
            min-height: 1100px;
            border: 3px solid rgba(0, 200, 83, 0.2);
        }

        .description-container {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            grid-column: 2;
            max-height: 1100px;
            overflow-y: auto;
            border: 3px solid rgba(100, 126, 234, 0.2);
            backdrop-filter: blur(10px);
        }

        .description-title {
            font-size: 2em;
            color: #00c853;
            margin-bottom: 20px;
            border-bottom: 4px solid #00c853;
            padding-bottom: 15px;
            font-weight: 700;
        }

        .description-content {
            color: #333;
            line-height: 1.9;
            font-size: 1em;
        }

        .description-content p {
            margin-bottom: 15px;
            text-align: justify;
        }

        .description-content p strong {
            color: #00c853;
            font-weight: 600;
        }

        .description-content ul {
            list-style: none;
            padding-left: 0;
            margin-bottom: 15px;
        }

        .description-content li {
            padding: 10px 0;
            padding-left: 30px;
            position: relative;
            color: #555;
        }

        .description-content li:before {
            content: "→";
            position: absolute;
            left: 0;
            color: #00c853;
            font-weight: bold;
            font-size: 1.3em;
        }

        .flowchart-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
        }

        .info-badge {
            display: inline-block;
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            color: #00c853;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 15px;
            font-weight: 600;
            border: 2px solid #00c853;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            font-size: 1em;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .default-info {
            color: #667eea;
            text-align: center;
            padding: 60px 20px;
            font-style: italic;
            font-size: 1.1em;
            font-weight: 500;
        }

        .topic-box {
            background: linear-gradient(135deg, #f0f7ff 0%, #f5f7fa 100%);
            padding: 18px;
            border-radius: 12px;
            margin-top: 18px;
            border-left: 5px solid #00c853;
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.1);
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #00c853;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00a040;
        }

        @media (max-width: 1024px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }

            .flowchart-container {
                grid-column: 1;
                max-height: 700px;
                min-height: 700px;
            }

            .description-container {
                grid-column: 1;
                max-height: 400px;
            }

            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
