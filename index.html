        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 2000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .flowchart-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: auto;
            grid-column: 1;
            max-height: 1000px;
            min-height: 1000px;
        }

        .description-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            grid-column: 2;
            max-height: 1000px;
            overflow-y: auto;
        }

        .description-title {
            font-size: 1.8em;
            color: #1e3c72;
            margin-bottom: 15px;
            border-bottom: 3px solid #00c853;
            padding-bottom: 10px;
        }

        .description-content {
            color: #555;
            line-height: 1.8;
            font-size: 0.95em;
        }

        .description-content p {
            margin-bottom: 12px;
        }

        .description-content ul {
            list-style: none;
            padding-left: 0;
            margin-bottom: 12px;
        }

        .description-content li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }

        .description-content li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #00c853;
            font-weight: bold;
            font-size: 1.2em;
        }

        .flowchart-svg {
            width: 100%;
            height: 100%;
        }

        .info-badge {
            display: inline-block;
            background: #e3f2fd;
            color: #1976d2;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            font-size: 0.9em;
        }

        .default-info {
            color: #999;
            text-align: center;
            padding: 40px 20px;
            font-style: italic;
        }

        .topic-box {
            background: #f0f7ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #00c853;
        }

        @media (max-width: 1024px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }

            .flowchart-container {
                grid-column: 1;
                max-height: 700px;
                min-height: 700px;
            }

            .description-container {
                grid-column: 1;
                max-height: 400px;
            }

            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
